name: Check Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release or prerelease tag to test
        required: true
        type: string
      previous_tag:
        description: Optional installed version to upgrade from
        required: false
        type: string

permissions:
  contents: read

jobs:
  install-and-upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download installer and check SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid version tag' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe*'
          if ($LASTEXITCODE) { throw 'Release download failed' }
          $installer = Get-Item "Eego-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          if ((Get-FileHash $installer).Hash -ne ((Get-Content "$installer.sha256") -split '\s+')[0]) { throw 'Installer checksum mismatch' }
          if ([version]$env:RELEASE_TAG.Substring(1) -ge [version]'0.10.2') {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'eego-update.json'
            if ($LASTEXITCODE) { throw 'Update manifest missing' }
            $update = Get-Content eego-update.json -Raw | ConvertFrom-Json
            if ($update.tag -ne $env:RELEASE_TAG -or $update.name -ne $installer.Name -or $update.size -ne $installer.Length -or $update.sha256 -ne (Get-FileHash $installer).Hash) {
              throw 'In-app update metadata does not match the release'
            }
          }
          if ($env:PREVIOUS_TAG) {
            if ($env:PREVIOUS_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid previous version' }
            gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe*' --dir previous
            if ($LASTEXITCODE) { throw 'Previous release download failed' }
            $old = Get-Item "previous/Eego-$($env:PREVIOUS_TAG.Substring(1))-windows-x64-setup.exe"
            if ((Get-FileHash $old).Hash -ne ((Get-Content "$old.sha256") -split '\s+')[0]) { throw 'Previous installer checksum mismatch' }
          }
      - name: Install, open Eego, create a task and check an in-place update
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = (Get-Item *-setup.exe).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs/Eego'
          if (Test-Path $app) { throw 'Expected a fresh Windows profile' }
          function Install-Eego($package) {
            $proc = Start-Process $package -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -PassThru -Wait
            if ($proc.ExitCode) { throw "Installer returned $($proc.ExitCode)" }
          }
          if (Test-Path previous) { Install-Eego (Get-Item previous/*-setup.exe).FullName } else { Install-Eego $installer }
          $env:Path = "$env:SystemRoot\system32;$env:SystemRoot"
          $library = Join-Path $app 'userdata'
          $service = Join-Path $app 'core/task_service_host_r3.exe'
          $ui = Start-Process "$app/HandmadeBTQuick.exe" -ArgumentList '--data-dir',"$env:RUNNER_TEMP/ui-smoke" -WorkingDirectory $app -PassThru
          try {
            $deadline = [datetime]::UtcNow.AddSeconds(40)
            while (!$ui.HasExited -and !$ui.MainWindowHandle -and [datetime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 200
              $ui.Refresh()
            }
            if (!$ui.MainWindowHandle -or !$ui.Responding) { throw 'No responsive Eego window' }
          } finally {
            if (!$ui.HasExited) { $ui.Kill($true) }
          }
          $stop = '{"op":"shutdown","requestId":"stop"}'
          $created = @('{"op":"create","requestId":"add","url":"https://example.invalid/upgrade-fixture.bin"}', $stop) | & $service --data-dir $library
          if ($LASTEXITCODE -or !($created[0] | ConvertFrom-Json).ok) { throw 'Could not create test task' }
          $id = ($created[0] | ConvertFrom-Json).id
          if (!$id) { throw 'Missing task id' }
          $record = Get-FileHash "$library/tasks.record"
          $downloads = New-Item -ItemType Directory -Force "$app/Downloads"
          Set-Content "$downloads/upgrade-fixture.bin" 'preserve this file'
          $autoRegistersHost = [version]$env:RELEASE_TAG.Substring(1) -gt [version]'0.10.4'
          if ($autoRegistersHost -and !(Test-Path previous)) {
            foreach ($browser in 'Microsoft/Edge','Google/Chrome') {
              $key = Get-Item "HKCU:/Software/$browser/NativeMessagingHosts/org.handmadebt.bridge"
              if ($key.GetValue('') -ne "$app\browser\native-host.json") { throw 'Fresh install did not register browser host' }
            }
          }
          if ($autoRegistersHost) {
            foreach ($browser in 'Microsoft/Edge','Google/Chrome') {
              $key = New-Item "HKCU:/Software/$browser/NativeMessagingHosts/org.handmadebt.bridge" -Force
              $key.SetValue('', "$env:RUNNER_TEMP\dev\browser\native-host.json")
            }
          } else {
            & "$app/Browser-Setup.cmd"
            if ($LASTEXITCODE) { throw 'Browser setup failed' }
          }
          Install-Eego $installer
          if ([version]$env:RELEASE_TAG.Substring(1) -ge [version]'0.10.6') {
            $guide = Join-Path $app 'browser\Enable-EdgeAssistant.ps1'
            $shortcutPath = Join-Path ([Environment]::GetFolderPath('Programs')) 'Eego\启用 Edge 下载助手.lnk'
            if (!(Test-Path $guide) -or !(Test-Path $shortcutPath)) { throw 'Missing Edge setup guide' }
            $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
            if (!(Test-Path -LiteralPath $shortcut.TargetPath)) { throw "Missing shortcut target $($shortcut.TargetPath)" }
            if ($shortcut.Arguments -notmatch '-File\s+"([^"]+)"') { throw "Missing guide argument in $($shortcut.Arguments)" }
            if ((Get-Item -LiteralPath $Matches[1]).FullName -ne (Get-Item -LiteralPath $guide).FullName) { throw "Incorrect guide path in $($shortcut.Arguments)" }
            $ext = Get-Content "$app/browser/extension/manifest.json" -Raw | ConvertFrom-Json
            if ($ext.version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Extension release version mismatch' }
          }
          if ((Get-FileHash "$library/tasks.record").Hash -ne $record.Hash) { throw 'Task record changed during install' }
          if ((Get-Content "$downloads/upgrade-fixture.bin") -ne 'preserve this file') { throw 'Download changed' }
          $listed = @('{"op":"list","requestId":"check"}', $stop) | & $service --data-dir $library
          if ($LASTEXITCODE -or $id -notin ($listed[0] | ConvertFrom-Json).tasks.id) { throw 'Saved task could not be reopened' }
          foreach ($browser in 'Microsoft/Edge','Google/Chrome') {
            $key = Get-Item "HKCU:/Software/$browser/NativeMessagingHosts/org.handmadebt.bridge"
            if ($key.GetValue('') -ne "$app\browser\native-host.json") { throw 'Browser registration changed' }
          }
          if ((Get-Content "$app/manifest.json" -Raw | ConvertFrom-Json).version) {
            $proc = Start-Process $installer -ArgumentList '/VERYSILENT','/NORESTART','/EEGOUPDATE=1',"/DIR=`"$app`"" -PassThru
            if (!$proc.WaitForExit(120000) -or $proc.ExitCode) { throw 'Update installer failed' }
            $expectedTitle = (Get-Content "$app/ui-text.json" -Raw | ConvertFrom-Json).'鹅鹅下载 · 统一版'
            $limit = [datetime]::UtcNow.AddSeconds(40)
            do {
              $opened = Get-Process HandmadeBTQuick -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$app\HandmadeBTQuick.exe" -and $_.MainWindowTitle -eq $expectedTitle }
              if (!$opened) { Start-Sleep -Milliseconds 300 }
            } until ($opened -or [datetime]::UtcNow -ge $limit)
            if (!$opened) { throw 'Updated UI did not relaunch with the packaged window title' }
          }
