name: Check live in-app upgrade
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Older published version with in-app updates
        required: true
        type: string

permissions:
  contents: read

jobs:
  one-click-upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Install older release, accept its update prompt and verify the installed result
        shell: powershell
        env:
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:QT_ACCESSIBILITY = '1'
          if ($env:FROM_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid source tag' }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          Invoke-WebRequest -UseBasicParsing "$base/latest/download/eego-update.json" -OutFile update.json
          $latest = Get-Content update.json -Raw | ConvertFrom-Json
          if ([version]$latest.tag.Substring(1) -le [version]$env:FROM_TAG.Substring(1)) { throw 'Expected a newer release' }
          $name = "Eego-$($env:FROM_TAG.Substring(1))-windows-x64-setup.exe"
          $url = "$base/download/$env:FROM_TAG/$name"
          Invoke-WebRequest -UseBasicParsing $url -OutFile $name
          $digest = (Invoke-WebRequest -UseBasicParsing "$url.sha256").Content
          if ($digest -is [byte[]]) { $digest = [Text.Encoding]::UTF8.GetString($digest) }
          if ((Get-FileHash $name).Hash -ne ($digest -split '\s+')[0]) { throw 'Invalid source installer' }
          $setup = Start-Process ".\$name" -ArgumentList '/VERYSILENT','/NORESTART' -PassThru -Wait
          if ($setup.ExitCode) { throw 'Initial installation failed' }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Eego'
          $old = Start-Process "$dir\HandmadeBTQuick.exe" -WorkingDirectory $dir -PassThru -RedirectStandardError "$env:RUNNER_TEMP/eego-stderr.txt"
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class EegoWindows {
            public delegate bool Callback(IntPtr handle, IntPtr unused);
            [DllImport("user32.dll")] static extern bool EnumWindows(Callback callback, IntPtr unused);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr handle, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr handle, StringBuilder text, int length);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr handle, uint msg, IntPtr key, IntPtr flags);
            public static IntPtr Find(int pid, string title) {
              IntPtr found=IntPtr.Zero;
              EnumWindows((h,u) => {
                uint owner; GetWindowThreadProcessId(h,out owner);
                if (owner!=pid) return true;
                var text=new StringBuilder(256); GetWindowText(h,text,256);
                if (text.ToString()!=title) return true;
                found=h; return false;
              },IntPtr.Zero);
              return found;
            }
          }
          '@
          $condition = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::NameProperty, (-join [char[]](0x4e0b,0x8f7d,0x5e76,0x5b89,0x88c5)))
          $deadline = [datetime]::UtcNow.AddSeconds(90)
          do {
            $dialog = [EegoWindows]::Find($old.Id, (-join [char[]](0x53d1,0x73b0,0x65b0,0x7248,0x672c)))
            if ($dialog -eq [IntPtr]::Zero) { Start-Sleep -Milliseconds 500 }
          } until ($dialog -ne [IntPtr]::Zero -or [datetime]::UtcNow -gt $deadline)
          if ($dialog -eq [IntPtr]::Zero) {
            Get-Content "$env:RUNNER_TEMP/eego-stderr.txt"
            throw 'The running application did not offer the latest version'
          }
          $element = [System.Windows.Automation.AutomationElement]::FromHandle($dialog)
          $button = $element.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          if ($button) { $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke() }
          else {
            [void][EegoWindows]::PostMessage($dialog, 0x100, [IntPtr]13, [IntPtr]0)
            [void][EegoWindows]::PostMessage($dialog, 0x101, [IntPtr]13, [IntPtr]0)
          }
          if (!$old.WaitForExit(300000)) { throw 'The updater did not shut the old app down' }
          $deadline = [datetime]::UtcNow.AddSeconds(120)
          do {
            $new = Get-Process HandmadeBTQuick -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $old.Id -and $_.MainWindowHandle -and $_.Path -eq "$dir\HandmadeBTQuick.exe" }
            if (!$new) { Start-Sleep -Milliseconds 500 }
          } until ($new -or [datetime]::UtcNow -gt $deadline)
          if (!$new) { throw 'The upgraded application did not reopen' }
          $installed = Get-Content "$dir\manifest.json" -Raw | ConvertFrom-Json
          if ("v$($installed.version)" -ne $latest.tag) { throw 'Wrong installed version' }
          if ((Get-FileHash "$dir\HandmadeBTQuick.exe").Hash -ne $installed.files.'HandmadeBTQuick.exe') { throw 'Installed UI checksum mismatch' }
          Write-Host "Verified in-app upgrade from $env:FROM_TAG to $($latest.tag)"
